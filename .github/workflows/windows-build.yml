name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the bundled CLIP model
        id: models-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: ai-models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Fetch the bundled AI model
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-models.mjs

      - name: Build the installer
        run: pnpm tauri build

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create a GitHub Release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true
