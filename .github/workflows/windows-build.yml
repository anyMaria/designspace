name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Run the JavaScript actions on Node 24 (Node 20 is deprecated; this removes the warning).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the bundled CLIP model
        id: models-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: ai-models-v2-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Fetch the bundled AI model
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-models.mjs

      - name: Check the bundled AI model files
        shell: pwsh
        run: |
          $dir = 'src-tauri/resources/models/Xenova/clip-vit-base-patch32'
          $required = 'config.json','preprocessor_config.json','tokenizer.json','tokenizer_config.json',
                      'onnx/vision_model_quantized.onnx','onnx/text_model_quantized.onnx'
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { Write-Error "Missing model files: $($missing -join ', ')"; exit 1 }
          $extra = Get-ChildItem "$dir/onnx" -Filter *.onnx | Where-Object { $_.Name -notlike '*_quantized.onnx' }
          if ($extra) { Write-Error "Unexpected full-size model files: $($extra.Name -join ', ')"; exit 1 }
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build the installer
        run: pnpm tauri build

      - name: Show the installer's SHA-256 (to check what you downloaded)
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($_.Name)  SHA-256: $h" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create a GitHub Release on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          draft: true
          generate_release_notes: true
