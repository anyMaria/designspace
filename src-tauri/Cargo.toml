[package]
name = "designspace"
version.workspace = true
edition.workspace = true
description = "Designspace: a private, local-first desktop app for visual inspiration."
publish = false

[lib]
name = "designspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
designspace-core = { path = "../crates/designspace-core" }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-log = "2.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ulid = "3.0.0"
log = "0.4"
infer = "0.22.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
trash = "5.2.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "charset", "stream"] }
scraper = "0.27.0"
url = "2.5.8"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
base64 = "0.22.1"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
